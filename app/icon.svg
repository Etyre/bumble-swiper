<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2410"/>
      <stop offset="1" stop-color="#0d1118"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2fae7f"/>
      <stop offset="1" stop-color="#7ee2b0"/>
    </linearGradient>
    <linearGradient id="leaf2" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#279a70"/>
      <stop offset="1" stop-color="#5fd49c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#ffc629" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffc629" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- macOS icon: rounded square, inset from the 1024 canvas. Bumble yellow glow, the sprout of the other swipers. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="104" y="104" width="816" height="816" rx="181" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="8"/>
  <!-- honeycomb cell behind the sprout -->
  <polygon points="512,250 700,358 700,574 512,682 324,574 324,358" fill="none" stroke="#ffc629" stroke-opacity="0.55" stroke-width="22" stroke-linejoin="round"/>
  <!-- sprout: stem -->
  <path d="M512 790 C512 660 500 580 470 520" fill="none" stroke="#3fbf8c" stroke-width="34" stroke-linecap="round"/>
  <!-- left leaf -->
  <path d="M470 520 C370 540 310 470 310 380 C405 375 480 425 470 520 Z" fill="url(#leaf2)"/>
  <path d="M470 520 C425 480 385 440 345 395" fill="none" stroke="#1d7a57" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>
  <!-- right leaf -->
  <path d="M512 580 C520 470 595 370 725 360 C735 490 640 580 512 580 Z" fill="url(#leaf)"/>
  <path d="M512 580 C570 520 630 460 700 395" fill="none" stroke="#1d7a57" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>
</svg>
